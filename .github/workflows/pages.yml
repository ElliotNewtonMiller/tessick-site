# Publishes the site to GitHub Pages on every push to main (Settings → Pages → Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Uploading and deploying are separate jobs: in one job, deploy-pages often doesn't see the
  # artifact uploaded a moment before (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The whole repo is the site, without the files that only help edit it.
      - run: mkdir _site && cp -r index.html 404.html robots.txt sitemap.xml assets media testlink docs _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
